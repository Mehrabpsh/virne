# Review every budget and comparator assumption before a scientific run.
name: GPU_SERVER
purpose: Editable candidate budgets, NOT scientifically frozen; review before real
  experiments
use_cuda: true
run_tests: false
threads: 4
calibration:
  reference_beta: 1.0  # Calibration heuristics only; overwritten by calibrated beta for experiments.
  seeds:
  - 11
  - 17
  - 23
  requests: 200
  arrival_rates:
  - 0.02
  - 0.2
  failure_rates:
  - 5.0e-06
  - 5.0e-05
  acceptance_range:
  - 0.15
  - 0.9
  satisfaction_range:
  - 0.1
  - 0.9
  minimum_peak_utilization: 0.2
  beta_target_compliance: 0.5
train_seeds:
- 31
- 37
- 41
test_seeds:
- 101
- 103
- 107
- 109
- 113
epochs: 100
requests: 1000
pn_nodes: 100
vn_size:
- 2
- 10
lifetime_scale: 200
mu_r: 0.1
link_failure_multiplier: 0.5
objective: multiplicative
reward: joint_terminal
features:
- raw_availability
- sla_requirement
- sla_margin
- partial_availability
- log_risk
- remaining_budget
resource_overrides:
  v_sim_setting.node_attrs_setting.0.low: 10
  v_sim_setting.node_attrs_setting.0.high: 30
  v_sim_setting.link_attrs_setting.0.low: 10
  v_sim_setting.link_attrs_setting.0.high: 40
learning_overrides:
  training.batch_size: 128
  rl.target_steps: 256
  rl.repeat_times: 10
  nn.embedding_dim: 128
  nn.num_gnn_layers: 3
comparators:
  ra_nrm:
    ra_heuristic.combine: product
    ra_heuristic.normalization: max
  ra_grc:
    ra_heuristic.combine: weighted_sum
    ra_heuristic.normalization: max
    ra_heuristic.alpha: 0.5
  evne:
    ra_evne.cpu_attribute: cpu
    ra_evne.bandwidth_attribute: bw
    ra_evne.empty_distance: 1
  evne_original:
    ra_evne.weibull_scale: 250000
    ra_evne.weibull_shape: 1.5
    history_value: 0
  cand_rl:
    cand_rl.profile: thesis_joint
    cand_rl.k: 10
    cand_rl.distance_weight: hops
    cand_rl.source: 0
    cand_rl.destination: 1
    cand_rl.resource_names:
    - cpu
    cand_rl.capacity_attributes:
    - max_cpu
    cand_rl.hidden_dims:
    - 128
    - 128
    cand_rl.mask_padding: true
    cand_rl.redundancy: none
