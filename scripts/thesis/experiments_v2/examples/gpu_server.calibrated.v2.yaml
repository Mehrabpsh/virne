experiment:
  name: gpu_server_calibration_v2
  description: Exploratory rate-scale/load calibration; candidate rates are not scientifically
    frozen.
runtime:
  device: auto
  threads: 4
  results_root: results/thesis_experiments_v2
  tensorboard:
    enabled: true
    flush_secs: 10
    request_interval: 1
environment:
  substrate:
    topology:
      type: waxman
      num_nodes: 100
      wm_alpha: 0.5
      wm_beta: 0.2
  workload:
    num_requests: 1000
    topology:
      type: random
      random_prob: 0.5
    vnr_size:
      distribution: uniform
      dtype: int
      low: 2
      high: 10
    arrival_rate: 0.2
    lifetime:
      distribution: exponential
      dtype: float
      scale: 200
  resources:
    physical_node:
      cpu:
        low: 50
        high: 100
    physical_link:
      bw:
        low: 50
        high: 100
    virtual_node:
      cpu:
        low: 10
        high: 30
    virtual_link:
      bw:
        low: 10
        high: 40
  reliability:
    backend: analytic
    mode: node_and_link
    config_id: CANDIDATE_FAILURE_SCALE_003
    nodes:
      lambda_f:
        distribution: categorical
        values:
        - 3.0e-07
        - 1.5e-06
        - 3.0e-06
        - 1.5e-05
        probabilities:
        - 0.25
        - 0.25
        - 0.25
        - 0.25
      mu_r: 0.1
    links:
      lambda_f: 7.5e-07
      mu_r: 0.1
  sla:
    levels:
    - 0.99
    - 0.999
    - 0.9995
    - 0.9999
    probabilities:
    - 0.4
    - 0.3
    - 0.2
    - 0.1
    assignment: discrete
    values: null
calibration:
  methods:
  - nrm
  - grc
  seeds:
  - 11
  - 17
  - 23
  requests: 200
  search_space:
    environment.workload.arrival_rate:
    - 0.1
    - 0.2
  reliability_scenarios:
    failure_scale_003:
      backend: analytic
      mode: node_and_link
      config_id: CANDIDATE_FAILURE_SCALE_003
      nodes:
        lambda_f:
          distribution: categorical
          values:
          - 3.0e-07
          - 1.5e-06
          - 3.0e-06
          - 1.5e-05
          probabilities:
          - 0.25
          - 0.25
          - 0.25
          - 0.25
        mu_r: 0.1
      links:
        lambda_f: 7.5e-07
        mu_r: 0.1
    failure_scale_001:
      backend: analytic
      mode: node_and_link
      config_id: CANDIDATE_FAILURE_SCALE_001
      nodes:
        lambda_f:
          distribution: categorical
          values:
          - 1.0e-07
          - 5.0e-07
          - 1.0e-06
          - 5.0e-06
          probabilities:
          - 0.25
          - 0.25
          - 0.25
          - 0.25
        mu_r: 0.1
      links:
        lambda_f: 2.5e-07
        mu_r: 0.1
  require_qualified: true
  criteria:
    acceptance_rate:
      min: 0.15
      max: 0.9
    sla_satisfaction_rate:
      min: 0.1
      max: 0.9
    minimum_peak_utilization: 0.2
    require_all_sla_classes: true
    require_monotonic_sla_difficulty: true
    monotonic_tolerance: 0.0
    require_no_proven_impossible: true
  beta_suggestion:
    enabled: true
    target_compliance: 0.5
  adopt_beta_for: []
protocol:
  training:
    online: true
    seeds:
    - 31
    epochs: 100
  evaluation:
    seeds:
    - 101
    online: true
learning_defaults:
  batch_size: 128
  target_steps: 256
  repeat_times: 10
  network:
    embedding_dim: 128
    num_gnn_layers: 3
  learning_rate:
    actor: 0.001
    critic: 0.001
methods:
  original_ppo:
    enabled: true
    label: PPO-DualGAT
    solver: ppo_dual_gat+
    kind: auto
    awareness:
      reliability: false
      sla: false
    objective:
      name: original
    reward:
      name: fixed_intermediate
  reliability_ppo:
    enabled: true
    label: Reliability-aware PPO-DualGAT
    solver: ppo_dual_gat+
    kind: auto
    awareness:
      reliability: true
      sla: true
    objective:
      name: multiplicative
      beta: 0.23142476412881738
    reward:
      name: joint_fixed
      intermediate_reward: 0.1
    reliability_features:
    - raw_availability
    - sla_requirement
    - sla_margin
    - partial_availability
    - log_risk
    - remaining_budget
    - normalized_log_risk
    - remaining_budget_fraction
  cand_rl:
    enabled: true
    label: Cand-RL
    solver: cand_rl
    kind: auto
    awareness:
      reliability: true
      sla: true
    objective:
      name: multiplicative
      beta: 0.23142476412881738
    reward:
      name: joint_fixed
      intermediate_reward: 0.1
    observation_features:
    - normalized_log_risk
    - remaining_budget_fraction
    profile: thesis_joint
    candidate:
      k: 10
      distance_weight: hops
      resource_names:
      - cpu
      capacity_attributes:
      - max_cpu
      mask_padding: true
    endpoints:
      source: 0
      destination: 1
    network:
      hidden_dims:
      - 128
      - 128
    redundancy: none
  ffd:
    enabled: true
    label: FFD
    solver: ffd_rank
    kind: auto
  nrm:
    enabled: true
    label: NRM
    solver: nrm_rank
    kind: auto
  grc:
    enabled: true
    label: GRC
    solver: grc_rank
    kind: auto
  rw:
    enabled: true
    label: RW
    solver: rw_rank
    kind: auto
  ra_nrm:
    enabled: true
    label: RA-NRM
    solver: ra_nrm
    kind: auto
    awareness:
      reliability: true
      sla: true
    objective:
      name: multiplicative
      beta: 0.23142476412881738
    reward:
      name: joint_fixed
      intermediate_reward: 0.1
    ra_heuristic:
      normalization: max
      combine: normalized_risk_weighted_sum
      alpha: 0.5
  ra_grc:
    enabled: true
    label: RA-GRC
    solver: ra_grc
    kind: auto
    awareness:
      reliability: true
      sla: true
    objective:
      name: multiplicative
      beta: 0.23142476412881738
    reward:
      name: joint_fixed
      intermediate_reward: 0.1
    ra_heuristic:
      normalization: max
      combine: normalized_risk_weighted_sum
      alpha: 0.5
  ra_evne_a:
    enabled: true
    label: RA-EVNE-A
    solver: ra_evne_a
    kind: auto
    awareness:
      reliability: true
      sla: true
    objective:
      name: multiplicative
      beta: 0.23142476412881738
    reward:
      name: joint_fixed
      intermediate_reward: 0.1
    ra_evne:
      cpu_attribute: cpu
      bandwidth_attribute: bw
      empty_distance: 1
  ra_evne_original:
    enabled: true
    label: RA-EVNE-original
    solver: ra_evne_original
    kind: auto
    awareness:
      reliability: true
      sla: true
    objective:
      name: multiplicative
      beta: 0.23142476412881738
    reward:
      name: joint_fixed
      intermediate_reward: 0.1
    ra_evne:
      cpu_attribute: cpu
      bandwidth_attribute: bw
      empty_distance: 1
      weibull_scale: 250000
      weibull_shape: 1.5
    history:
      initialization: zero
metrics:
- acceptance_rate
- avg_r2c_ratio
- long_term_r2c_ratio
- long_term_time_r2c_ratio
- sla_satisfaction_rate
- sla_service_rate_all_arrivals
- mean_delivered_availability
- mean_sla_shortfall
- median_sla_shortfall
- max_inservice_count
reporting:
  plots: true
  formats:
